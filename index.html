<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F6F5F0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="競馬観測LAB">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png">
  <title>TRICK LOGIC｜競馬観測LAB（やさしいライト版）</title>
  <style>
    :root {
      --bg-page: #F6F5F0;
      --bg-card: #FFFFFF;
      --bg-subtle: #EFECE4;
      --bg-soft-blue: #EEF3F8;
      --bg-soft-green: #ECFDF5;
      --bg-soft-red: #FEF2F2;
      --bg-soft-amber: #FFFBEB;
      --text-main: #1E293B;
      --text-sub: #475569;
      --text-muted: #64748B;
      --border: #CBD5E1;
      --border-strong: #94A3B8;
      --navy: #1E3A5F;
      --navy-dark: #132740;
      --green: #166534;
      --green-mid: #15803D;
      --red: #991B1B;
      --red-mid: #B91C1C;
      --amber: #92400E;
      --amber-mid: #B45309;
      --font-sans: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Meiryo", "Noto Sans JP", sans-serif;
    }

    * {
      box-sizing: border-box;
      font-family: var(--font-sans) !important;
    }

    body {
      margin: 0;
      padding: 0 0 96px 0;
      background: var(--bg-page);
      color: var(--text-main);
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea {
      font-family: var(--font-sans) !important;
      color: var(--text-main);
    }

    button {
      cursor: pointer;
      min-height: 44px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      font-size: 15px;
      font-weight: 700;
      transition: background 0.15s ease, transform 0.08s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--navy);
      color: #FFFFFF;
      border-color: var(--navy);
    }

    .btn-primary:hover {
      background: var(--navy-dark);
    }

    .btn-success {
      background: var(--green-mid);
      color: #FFFFFF;
      border-color: var(--green-mid);
    }

    .btn-secondary {
      background: var(--bg-subtle);
      color: var(--text-main);
      border-color: var(--border-strong);
    }

    .btn-help {
      min-width: 34px;
      min-height: 34px;
      height: 34px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--bg-soft-blue);
      color: var(--navy);
      border: 1px solid #93C5FD;
      font-size: 14px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    header.app-header {
      background: var(--bg-card);
      border-bottom: 2px solid var(--border);
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-top {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .app-title {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: 0.02em;
    }

    .race-meta {
      margin: 2px 0 0 0;
      font-size: 14px;
      color: var(--text-sub);
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .main-container {
      max-width: 1120px;
      margin: 14px auto 0 auto;
      padding: 0 14px;
    }

    .summary-bar {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .sum-main {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .sum-label {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-sub);
    }

    .sum-value {
      font-size: 24px;
      font-weight: 700;
    }

    .sum-badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
    }

    .badge-ok {
      background: var(--bg-soft-green);
      color: var(--green);
      border: 1px solid #86EFAC;
    }

    .badge-warn {
      background: var(--bg-soft-amber);
      color: var(--amber);
      border: 1px solid #FCD34D;
    }

    .sum-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .card-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: var(--navy);
    }

    .card-desc {
      margin: 0 0 12px 0;
      font-size: 14px;
      color: var(--text-sub);
    }

    .horse-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }

    .horse-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .horse-name-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .horse-num {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--navy);
      color: #FFFFFF;
      font-size: 17px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .horse-name {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
    }

    .ev-pill {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .ev-pill strong {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.01em;
    }

    .ev-good {
      background: var(--bg-soft-green);
      color: var(--green);
      border: 1.5px solid #22C55E;
    }

    .ev-nerai {
      background: #EFF6FF;
      color: #1D4ED8;
      border: 1.5px solid #60A5FA;
    }

    .ev-bad
